name: Solve Issue with AI

on:
  issues:
    types: [labeled]

jobs:
  solve:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Aider CLI with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install aider-chat
          aider --model gemini/gemini-3.6-flash \
                --auto-commits \
                --yes-always \
                --message "Fix issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
          title: "Fix for Issue #${{ github.event.issue.number }}"
          body: "Automated PR generated by AI to resolve issue #${{ github.event.issue.number }}."